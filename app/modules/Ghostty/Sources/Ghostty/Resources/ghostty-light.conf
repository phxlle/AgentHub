background = #FBFBFF
foreground = #2D3748
cursor-color = #4A5568
cursor-text = #FBFBFF
selection-background = #CBD5E0
selection-foreground = #1A202C
# Never set minimum-contrast here: Ghostty's contrast pass compares text
# against the terminal background premultiplied by background-opacity. With
# background-opacity = 0 that reference is transparent black, so every glyph
# on the default background fails the ratio and gets flipped to white —
# invisible over the app's light backdrop.
background-opacity = 0

palette = 0=#2D3748
palette = 1=#C53030
palette = 2=#2F855A
palette = 3=#975A16
palette = 4=#2B6CB0
palette = 5=#805AD5
palette = 6=#287A8A
palette = 7=#718096
palette = 8=#4A5568
palette = 9=#C53030
palette = 10=#276749
palette = 11=#744210
palette = 12=#2C5282
palette = 13=#6B46C1
palette = 14=#285E61
palette = 15=#2D3748

# AgentHub owns Cmd+1..4 (workspace switching). On macOS Ghostty binds Cmd+1..8
# to goto_tab as non-performable, so the embedded terminal would swallow them
# even though it has no Ghostty tabs. Keep in sync with
# AgentHubGhosttyAppearanceConfiguration.hostKeybindOverrides.
keybind = super+digit_1=unbind
keybind = super+1=unbind
keybind = super+digit_2=unbind
keybind = super+2=unbind
keybind = super+digit_3=unbind
keybind = super+3=unbind
keybind = super+digit_4=unbind
keybind = super+4=unbind
