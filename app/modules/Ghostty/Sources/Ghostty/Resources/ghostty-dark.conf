background = #252627
foreground = #E2E8F0
cursor-color = #A0AEC0
cursor-text = #252627
selection-background = #4A5568
selection-foreground = #F7FAFC
# minimum-contrast is only safe in this dark profile: with background-opacity 0
# Ghostty's contrast reference degrades to black, which approximates the app's
# dark backdrop. The light profile must NOT set it (see ghostty-light.conf).
minimum-contrast = 4.5
background-opacity = 0

palette = 0=#0D0D0D
palette = 1=#E06C75
palette = 2=#98C379
palette = 3=#ECC94B
palette = 4=#61AFEF
palette = 5=#C678DD
palette = 6=#56B6C2
palette = 7=#E2E8F0
palette = 8=#718096
palette = 9=#E88A91
palette = 10=#B5D4A1
palette = 11=#F6E05E
palette = 12=#8CC8F5
palette = 13=#D8A0E8
palette = 14=#7DCBD5
palette = 15=#F7FAFC

# AgentHub owns Cmd+1..4 (workspace switching). On macOS Ghostty binds Cmd+1..8
# to goto_tab as non-performable, so the embedded terminal would swallow them
# even though it has no Ghostty tabs. Keep in sync with
# AgentHubGhosttyAppearanceConfiguration.hostKeybindOverrides.
keybind = super+digit_1=unbind
keybind = super+1=unbind
keybind = super+digit_2=unbind
keybind = super+2=unbind
keybind = super+digit_3=unbind
keybind = super+3=unbind
keybind = super+digit_4=unbind
keybind = super+4=unbind
